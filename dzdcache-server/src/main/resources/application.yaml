spring:
  application:
    name: dzdcache
  threads:
    virtual:
      enabled: true
server:
  shutdown: graceful
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,cluster
        liveness:
          include: livenessState,storage
dzdcache:
  max-schemas: 100
  max-revisions-per-schema: 100000
  replication-timeout: 3s
  sync-interval: 10s
  partitions: ${DZDCACHE_PARTITIONS:1}
  api-token: ${DZDCACHE_API_TOKEN:}
  cluster-token: ${DZDCACHE_CLUSTER_TOKEN:}
  discovery:
    mode: ${DZDCACHE_DISCOVERY_MODE:standalone}
  persistence:
    enabled: ${DZDCACHE_PERSISTENCE_ENABLED:false}
    directory: ${DZDCACHE_PERSISTENCE_DIRECTORY:/var/lib/dzdcache}

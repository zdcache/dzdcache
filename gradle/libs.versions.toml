[versions]
h2-ignite = "1.4.197"
hazelcast = "5.7.0"
ignite = "2.17.0"
infinispan = "15.2.6.Final"
jackson = "3.1.5"
jedis = "5.2.0"
jmh = "1.37"
maven-publish = "0.37.0"
micrometer = "1.17.1"
slf4j = "2.0.18"
spring-boot = "4.1.1"
zdcache = "0.3.1"

[libraries]
h2-ignite = { module = "com.h2database:h2", version.ref = "h2-ignite" }
hazelcast = { module = "com.hazelcast:hazelcast", version.ref = "hazelcast" }
ignite-core = { module = "org.apache.ignite:ignite-core", version.ref = "ignite" }
ignite-indexing = { module = "org.apache.ignite:ignite-indexing", version.ref = "ignite" }
infinispan-api = { module = "org.infinispan:infinispan-api" }
infinispan-bom = { module = "org.infinispan:infinispan-bom", version.ref = "infinispan" }
infinispan-core = { module = "org.infinispan:infinispan-core" }
infinispan-query = { module = "org.infinispan:infinispan-query" }
jackson-databind = { module = "tools.jackson.core:jackson-databind", version.ref = "jackson" }
jackson-smile = { module = "tools.jackson.dataformat:jackson-dataformat-smile", version.ref = "jackson" }
jedis = { module = "redis.clients:jedis", version.ref = "jedis" }
jmh-core = { module = "org.openjdk.jmh:jmh-core", version.ref = "jmh" }
jmh-generator = { module = "org.openjdk.jmh:jmh-generator-annprocess", version.ref = "jmh" }
micrometer-core = { module = "io.micrometer:micrometer-core", version.ref = "micrometer" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
spring-boot-autoconfigure = { module = "org.springframework.boot:spring-boot-autoconfigure", version.ref = "spring-boot" }
spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-boot-health = { module = "org.springframework.boot:spring-boot-health", version.ref = "spring-boot" }
spring-boot-starter-jackson = { module = "org.springframework.boot:spring-boot-starter-jackson", version.ref = "spring-boot" }
testcontainers = { module = "org.testcontainers:testcontainers" }
zdcache = { module = "io.github.zdcache:zdcache", version.ref = "zdcache" }

[plugins]
maven-publish = { id = "com.vanniktech.maven.publish", version.ref = "maven-publish" }
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }

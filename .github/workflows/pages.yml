name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Assemble site sources
        run: |
          mkdir -p _site_src
          cp -R site/. _site_src/
          python3 scripts/site/pages.py . _site_src "$GITHUB_REPOSITORY"
          if [ -f docs/BENCHMARK.md ]; then
            if ls docs/benchmark/*.svg >/dev/null 2>&1; then cp docs/benchmark/*.svg _site_src/benchmark/; fi
            printf 'benchmark: true\n' >> _site_src/_config.yml
          fi
      - uses: actions/configure-pages@v6
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./_site_src
          destination: ./_site
      - uses: actions/upload-pages-artifact@v5

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

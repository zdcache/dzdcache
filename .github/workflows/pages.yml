name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Assemble site sources
        run: |
          mkdir -p _site_src/changelog
          cp -R site/. _site_src/
          page() {
            printf -- '---\nlayout: default\ntitle: %s\nsource: %s\n---\n{%% raw %%}\n' "$2" "$1"
            sed -E -e "s#\]\(CHANGELOG\.md\)#](site:changelog/)#g" -e "s#\]\(docs/BENCHMARK\.md\)#](site:benchmark/)#g" \
              -e "s#\]\(([^)#:]+)\)#](https://github.com/${GITHUB_REPOSITORY}/blob/main/\1)#g" -e "s#\]\(site:#](#g" "$1"
            printf '\n{%% endraw %%}\n'
          }
          page README.md DZDCache > _site_src/index.md
          page CHANGELOG.md "DZDCache changelog" > _site_src/changelog/index.md
          if [ -f docs/BENCHMARK.md ]; then
            mkdir -p _site_src/benchmark
            page docs/BENCHMARK.md "DZDCache benchmark" > _site_src/benchmark/index.md
            printf 'benchmark: true\n' >> _site_src/_config.yml
          fi
      - uses: actions/configure-pages@v6
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./_site_src
          destination: ./_site
      - uses: actions/upload-pages-artifact@v5

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

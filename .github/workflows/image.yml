name: image
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build the server image from, e.g. v0.1.0
        required: true
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}
      - name: Build the jar on the runner's own architecture, also for tags that predate this
        run: sed -i 's#^FROM eclipse-temurin:21-jdk-jammy AS build#FROM --platform=$BUILDPLATFORM eclipse-temurin:21-jdk-jammy AS build#' Dockerfile
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: version
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
        env:
          TAG: ${{ inputs.tag }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/zdcache/dzdcache-server:${{ steps.version.outputs.version }}
            ghcr.io/zdcache/dzdcache-server:latest

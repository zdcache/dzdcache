openapi: 3.1.0
info:
  title: Distributed ZDCache
  version: 0.1.0
  description: |
    Generic JSON graph cache with runtime-compiled schemas. Publishers register
    schemas and send roots, updates and invalidations to a node through the service
    address; DZDCache handles replication. Searches return locally cached matching
    roots. HTTP 200 with [] is a successful answer about current cache contents,
    not a cache miss. Distributed mutation failures may be partially applied: retry
    the same revision, value and deadline. See docs/CONSISTENCY.md for protocol limitations.
servers:
  - url: http://localhost:8080
security:
  - apiBearer: []
paths:
  /cache/schemas:
    post:
      operationId: publishSchema
      summary: Publish an immutable schema version and replicate it
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SchemaDefinition'}
      responses:
        '201':
          description: Published or already registered with the same definition
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SchemaView'}
        default: {$ref: '#/components/responses/Error'}
    get:
      operationId: listSchemas
      responses:
        '200':
          description: Published schema definitions
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/SchemaDefinition'}
        default: {$ref: '#/components/responses/Error'}
  /cache/cluster:
    get:
      operationId: getCluster
      summary: The cluster's size and members, and a resize in progress
      responses:
        '200':
          description: The cluster as this node knows it from its log
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ClusterView'}
        default: {$ref: '#/components/responses/Error'}
    put:
      operationId: resizeCluster
      summary: Change the cluster size while it runs
      description: Grows or shrinks the cluster through a joint configuration, so quorums stay safe during the change. To shrink, name the members that leave. Answers once the change is complete; 409 while another resize runs.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ResizeRequest'}
      responses:
        '200':
          description: The cluster after the change
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ClusterView'}
        default: {$ref: '#/components/responses/Error'}
  /cache/schemas/{id}/{version}:
    get:
      operationId: getSchema
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: string}
        - name: version
          in: path
          required: true
          schema: {type: integer, minimum: 1}
      responses:
        '200':
          description: Schema and supported searches
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SchemaDefinition'}
        default: {$ref: '#/components/responses/Error'}
  /cache/entries:
    post:
      operationId: putEntry
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PutRequest'}
      responses:
        '200':
          description: Delivered to known peers; an older revision is ignored
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Mutation'}
        default: {$ref: '#/components/responses/Error'}
  /cache/entries/batch:
    post:
      operationId: putBatch
      description: Each root is stored independently. Check every result status; there is no batch rollback.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              maxItems: 1000
              items: {$ref: '#/components/schemas/PutRequest'}
      responses:
        '200':
          description: Individual outcomes, including failures
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [index, status]
                  properties:
                    index: {type: integer}
                    status: {type: integer}
                    mutation:
                      anyOf:
                        - {$ref: '#/components/schemas/Mutation'}
                        - {type: 'null'}
                    error: {type: [string, 'null']}
        default: {$ref: '#/components/responses/Error'}
  /cache/entries/get:
    post:
      operationId: getEntry
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/IdentityRequest'}
      responses:
        '200':
          description: Full root graph, or only the selected fields
          headers:
            X-Dzdcache-Stale: {$ref: '#/components/headers/Stale'}
            X-Dzdcache-Staleness-Ms: {$ref: '#/components/headers/StalenessMs'}
          content:
            application/json:
              schema: {type: object, additionalProperties: true}
        '404':
          description: Absent root (empty body), or unknown specification (problem body)
        default: {$ref: '#/components/responses/Error'}
  /cache/search:
    post:
      operationId: searchRoots
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - {$ref: '#/components/schemas/SpecificationReference'}
                - type: object
                  properties:
                    dimension:
                      type: string
                      description: The indexed dimension that selects the candidates. Required unless scan is true.
                    value:
                      description: Required for exact or prefix indexes. For compound dimensions, an array with one value per part, except a last range part.
                      anyOf:
                        - $ref: '#/components/schemas/Scalar'
                        - type: array
                          items: {$ref: '#/components/schemas/Scalar'}
                    from:
                      description: Required inclusive lower endpoint for range indexes
                      $ref: '#/components/schemas/Scalar'
                    to:
                      description: Required inclusive upper endpoint for range indexes
                      $ref: '#/components/schemas/Scalar'
                    fields: {$ref: '#/components/schemas/Fields'}
                    limit:
                      type: integer
                      minimum: 1
                      description: Return at most this many matching roots, chosen arbitrarily. Without it, more matches than dzdcache.max-search-results return 422.
                    filter: {$ref: '#/components/schemas/Filter'}
                    count:
                      type: boolean
                      description: Return {"count":n}, the number of matching roots, instead of the roots. Takes no fields or limit.
                    countBy:
                      type: string
                      description: Return the number of matching roots for each value at this path, as an object from value to count. A path through /* counts each root once per distinct element. Takes no fields or limit.
                    scan:
                      type: boolean
                      description: Consider every root of the specification instead of a dimension's matches. Without a dimension, a scan over more than dzdcache.max-scan roots returns 422.
      responses:
        '200':
          description: Matching complete root graphs, including an authoritative empty array; with count or countBy, an object of counts
          headers:
            X-Dzdcache-Stale: {$ref: '#/components/headers/Stale'}
            X-Dzdcache-Staleness-Ms: {$ref: '#/components/headers/StalenessMs'}
          content:
            application/json:
              schema:
                type: array
                items: {type: object, additionalProperties: true}
        default: {$ref: '#/components/responses/Error'}
  /cache/changes:
    get:
      operationId: streamChanges
      description: 'Server-Sent Events of what this node applies: PUT (with the value), INVALIDATED, EVICTED, EVICTED_LRU and EXPIRED, in log order and at the same positions on every node, so a client can resume on another node. The event id is the position; send it back as Last-Event-ID or from to resume after it. RESET means the node cannot continue from that position, because it is older than dzdcache.changes-buffer or the node replaced its data; read the state again.'
      parameters:
        - {name: specification, in: query, required: false, schema: {type: string}}
        - {name: schemaVersion, in: query, required: false, schema: {type: integer, minimum: 1}}
        - {name: from, in: query, required: false, description: Resume after this position; Last-Event-ID takes precedence, schema: {type: string, pattern: '^[0-9]+--?[0-9]+$'}}
        - {name: Last-Event-ID, in: header, required: false, schema: {type: string}}
      responses:
        '200':
          description: 'An endless stream; each event has id <position>, event <kind> and JSON data with position, kind, specification, schemaVersion, identity, revision, value for PUT, and at, the log time in epoch milliseconds'
          content:
            text/event-stream:
              schema: {type: string}
        default: {$ref: '#/components/responses/Error'}
  /cache/entries/invalidate:
    post:
      operationId: invalidateEntry
      description: Store a tombstone at a newer owner-issued mutation revision
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RemoveRequest'}
      responses:
        '204': {description: Invalidation delivered}
        default: {$ref: '#/components/responses/Error'}
  /cache/entries/evict:
    post:
      operationId: evictEntry
      description: Remove only the current matching revision; use invalidate for authoritative deletion
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RemoveRequest'}
      responses:
        '204': {description: Eviction delivered}
        default: {$ref: '#/components/responses/Error'}
components:
  headers:
    Stale:
      description: Present and true when this node could not confirm it has every acknowledged write and answered from its own copy because dzdcache.max-staleness allows it.
      schema: {type: boolean}
    StalenessMs:
      description: With X-Dzdcache-Stale, how long ago this node last knew its data was current, in milliseconds; never more than dzdcache.max-staleness.
      schema: {type: integer, minimum: 0}
  securitySchemes:
    apiBearer:
      type: http
      scheme: bearer
      description: Required when dzdcache.api-token is configured. Disabled by default for local standalone use.
  responses:
    Error:
      description: |
        400 invalid input; 401 invalid token; 404 unknown specification; 409 conflicting
        schema/revision; 413 body too large; 422 search matches too many roots; 429 schema/revision limits; 503 unavailable
        or potentially partially applied mutation. Filter errors can have a generic JSON body.
      content:
        application/problem+json:
          schema:
            type: object
            properties:
              type: {type: string}
              title: {type: string}
              status: {type: integer}
              detail: {type: string}
              instance: {type: string}
  schemas:
    Filter:
      description: 'Evaluated in the cache on each candidate before limit, fields and counting. Either a condition {path, op, value, type} or {all: [...]}, {any: [...]} or {not: {...}}. Paths use dimension syntax; /* matches when any element matches. Ops: eq, ne, lt, lte, gt, gte, in (an array of values), prefix, exists (no value). type (string, integer, number, boolean, timestamp) is only needed for timestamps of JSON-only specifications.'
      type: object
      additionalProperties: true
    Scalar:
      type: [string, number, boolean]
    SpecificationReference:
      type: object
      required: [specification, schemaVersion]
      properties:
        specification: {type: string}
        schemaVersion: {type: integer, minimum: 1}
    IdentityRequest:
      allOf:
        - {$ref: '#/components/schemas/SpecificationReference'}
        - type: object
          required: [identity]
          properties:
            identity: {$ref: '#/components/schemas/Scalar'}
            fields: {$ref: '#/components/schemas/Fields'}
    Fields:
      type: array
      maxItems: 64
      items: {type: string, example: /address/city}
      description: JSON Pointers to declared properties to return, without array traversal. A selected object or array is returned whole. Omit for the full root graph.
    RemoveRequest:
      allOf:
        - {$ref: '#/components/schemas/IdentityRequest'}
        - type: object
          properties:
            revision: {$ref: '#/components/schemas/Revision'}
    Revision:
      type: integer
      format: int64
      minimum: 0
      description: Owner-issued revision. Omit it or send 0 to take the next revision in log order, so the last write wins; a retry then counts as a new write. Evict without a revision removes the current one.
    PutRequest:
      allOf:
        - {$ref: '#/components/schemas/SpecificationReference'}
        - type: object
          required: [value]
          properties:
            revision: {$ref: '#/components/schemas/Revision'}
            value: {type: object, additionalProperties: true}
            writtenAt:
              type: [integer, 'null']
              format: int64
              minimum: 0
              description: Stable owner event time in epoch milliseconds. Required for finite TTL unless expiresAt is supplied; reuse on retries.
            expiresAt:
              type: [integer, 'null']
              format: int64
              minimum: 0
              description: Optional absolute epoch-millisecond deadline overriding the schema TTL. Mutually exclusive with writtenAt.
    Mutation:
      allOf:
        - {$ref: '#/components/schemas/RemoveRequest'}
        - type: object
          properties:
            operation: {type: string, enum: [PUT, INVALIDATE, EVICT, WATERMARK]}
            value: {type: [object, 'null'], additionalProperties: true}
            expiresAt: {type: [integer, 'null'], format: int64}
    SchemaDefinition:
      type: object
      required: [id, version, identity, capacity]
      properties:
        id: {type: string, pattern: '^[a-zA-Z0-9][a-zA-Z0-9._:-]{0,127}$'}
        version: {type: integer, minimum: 1}
        schema:
          type: object
          additionalProperties: true
          description: Optional bounded supported JSON Schema subset; see docs/SCHEMAS.md. Without a schema, every dimension and compound part declares a type and roots are stored as JSON.
        identity: {type: string, example: /id}
        capacity: {type: integer, minimum: 1}
        ttl: {type: string, default: infinite, example: PT5M}
        dimensions:
          type: array
          maxItems: 128
          items:
            type: object
            required: [name, index]
            properties:
              name: {type: string, maxLength: 128}
              path: {type: string, example: '/courses/*/code', description: Required except for compound dimensions}
              index: {type: string, enum: [exact, prefix, range, compound]}
              type:
                type: string
                enum: [string, integer, number, boolean, timestamp]
                description: Required without a schema and rejected with one. A timestamp is an ISO-8601 instant string.
              parts:
                type: array
                minItems: 2
                maxItems: 8
                description: Compound only. All parts but the last are exact. Parts under the same array element match within one element.
                items:
                  type: object
                  required: [path, index]
                  properties:
                    path: {type: string}
                    index: {type: string, enum: [exact, prefix, range]}
                    type: {type: string, enum: [string, integer, number, boolean, timestamp], description: Required without a schema and rejected with one.}
    Member:
      type: object
      properties:
        id: {type: string}
        url: {type: string, format: uri}
        startedAt: {type: integer, format: int64}
    ClusterView:
      type: object
      properties:
        size: {type: integer, minimum: 1}
        members: {type: array, items: {$ref: '#/components/schemas/Member'}}
        master: {$ref: '#/components/schemas/Member'}
        previousSize: {type: [integer, 'null'], description: Set while a resize is in progress}
        previousMembers: {type: [array, 'null'], items: {$ref: '#/components/schemas/Member'}}
        learners: {type: array, items: {$ref: '#/components/schemas/Member'}, description: Nodes that hold a full copy and apply the log but do not vote}
    ResizeRequest:
      type: object
      required: [size]
      properties:
        size: {type: integer, minimum: 1}
        leaving: {type: array, items: {type: string}, description: Ids of the members that leave when shrinking}
    SchemaView:
      type: object
      required: [id, version, fingerprint, javaClass]
      properties:
        id: {type: string}
        version: {type: integer}
        fingerprint: {type: string}
        javaClass: {type: string}
